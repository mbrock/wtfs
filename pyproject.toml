[project]
name = "wtfs"
version = "0.1.0"
description = "Fast directory scanning utility with beautiful Python analysis tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=14.2.0",
]

[project.scripts]
wtfsdump = "wtfs.dump:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
